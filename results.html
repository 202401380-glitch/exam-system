<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Examora — All results</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-tick"></span>
    <span class="brand-mark">Hot Examora</span>
  </a>
  <nav>
    <a href="index.html">Register</a>
    <a href="login.html">Sign in</a>
  </nav>
</header>

<main class="top-align" style="justify-content: center;">
  <div class="results-wrap">
    <h1>All results</h1>
    <p class="subhead">
      Everything registered and every exam attempt recorded on <em>this</em> browser —
      there's no server, so this table only shows data saved on this device.
    </p>

    <div class="table-actions">
      <span style="font-size: 13px; color: var(--paper-dim);" id="summary-line"></span>
      <button class="btn btn-ghost btn-sm" id="reset-btn">Clear all local data</button>
    </div>

    <div id="table-slot"></div>
  </div>
</main>

<footer class="foot-note">stored locally in this browser · no server involved</footer>

<script src="js/storage.js"></script>
<script src="js/results.js"></script>
</body>
</html>
