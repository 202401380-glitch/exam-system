<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Examora — Your grade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-tick"></span>
    <span class="brand-mark">Hot Examora</span>
  </a>
  <nav>
    <a href="results.html">All results</a>
  </nav>
</header>

<main>
  <div class="card outcome-card" id="outcome-card" hidden>
    <div class="outcome-icon good">✓</div>
    <p class="card-eyebrow">Exam submitted</p>
    <h1 id="greeting">Nice work!</h1>
    <p class="subhead" id="subline">You submitted with time to spare.</p>

    <p class="score-display" id="score-display">–</p>
    <p class="score-label" id="score-label">correct answers</p>

    <a class="btn btn-ghost" href="index.html">Back to home</a>
  </div>
</main>

<footer class="foot-note">stored locally in this browser · no server involved</footer>

<script src="js/storage.js"></script>
<script>
  const raw = sessionStorage.getItem("cc_last_result");
  const email = Session.get();
  let result = raw ? JSON.parse(raw) : null;

  if (!result && email) {
    result = Results.latestForEmail(email);
  }

  if (!result || result.status !== "submitted") {
    window.location.replace(email ? "login.html" : "index.html");
  } else {
    document.getElementById("outcome-card").hidden = false;
    document.getElementById(
      "greeting"
    ).textContent = `Well done, ${result.firstName} ${result.lastName}!`;
    document.getElementById(
      "score-display"
    ).textContent = `${result.score} / ${result.total}`;
    const pct = Math.round((result.score / result.total) * 100);
    document.getElementById(
      "score-label"
    ).textContent = `${pct}% correct — submitted on time`;
  }
</script>
</body>
</html>
